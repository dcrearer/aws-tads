name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for all jobs; individual jobs widen as needed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (pinned)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # rustsec/audit-check opens issues on new advisories
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cdk:
    name: cdk synth / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install CDK CLI
        run: npm install -g aws-cdk@2
      - name: Sync deps
        working-directory: cdk
        run: uv sync
      - name: Pytest
        working-directory: cdk
        run: uv run pytest -q
      - name: Synth (placeholder binaries)
        working-directory: cdk
        env:
          CDK_PLACEHOLDER: "1"
        run: uv run cdk synth --quiet

  security-scan:
    name: ASH security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      # Synthesize the CloudFormation template first so the IaC scanners (checkov, cfn-nag)
      # have something to scan — ASH does not run `cdk synth` itself.
      - name: Install CDK CLI
        run: npm install -g aws-cdk@2
      - name: Synth (placeholder binaries)
        working-directory: cdk
        env:
          CDK_PLACEHOLDER: "1"
        run: uv sync && uv run cdk synth --quiet
      - name: Run ASH
        run: uvx git+https://github.com/awslabs/automated-security-helper.git@v3 --mode local
