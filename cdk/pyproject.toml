[project]
name = "tads-infra"
version = "0.1.0"
description = "AWS CDK infrastructure for the TADS API (Rust on Lambda)"
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0,<11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
