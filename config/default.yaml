# TADS application configuration.
# Every value is overridable at runtime by env var `TADS__<SECTION>__<KEY>`
# (double-underscore nesting), which is how each Lambda receives its runtime settings.

# Aurora PostgreSQL via RDS Proxy. proxy_endpoint / db_name / secret_arn are set per-environment
# by the CDK stack (TADS__DATABASE__PROXY_ENDPOINT, __DB_NAME, __SECRET_ARN). The password is
# fetched from Secrets Manager at cold start, never configured here.
database:
  proxy_endpoint: ""
  port: 5432
  db_name: "tads"
  username: "tads"
  secret_arn: ""
  max_connections: 5

# SQS queue the tracks/events handlers enqueue delete-request work onto.
# Set per-environment via TADS__DELETE_QUEUE_URL.
delete_queue_url: ""

# Maximum serialized Event size (bytes, 360 KiB). Larger Events are rejected with 413 —
# TADS holds small inline metadata; large data belongs in TAMS. (Postgres has no hard row
# limit; this stays an API contract carried over from the DynamoDB design.)
max_payload_bytes: 368640

service:
  name: "TADS Reference (Rust)"
  type: "urn:x-tads:service:reference.rust"
  api_version: "0.1"
  service_version: "0.1.0"

# Video-understanding inference (analyzer / webhook-receiver Lambdas). Endpoints, OAuth client-cred
# secret ARNs, and the Bedrock model are set per-environment by the CDK stack via
# TADS__INFERENCE__<KEY>. Client secrets live in Secrets Manager, never here.
inference:
  tads_base_url: ""
  tads_token_url: ""
  tads_secret_arn: ""
  tads_scope: "tads-api/write"
  tams_token_url: ""
  tams_secret_arn: ""
  tams_scope: ""
  # analyzer
  bedrock_model_id: ""
  frames_per_second: 1.0
  # webhook-receiver
  work_queue_url: ""
  tams_entity_base: ""        # e.g. tams://tams.example.com  -> timeline_reference.entity_id
  webhook_secret_arn: ""      # inbound TAMS shared secret (empty = verification disabled, dev only)
  webhook_header: "x-api-key"
