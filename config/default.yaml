# TADS application configuration.
# Every value is overridable at runtime by env var `TADS__<SECTION>__<KEY>`
# (double-underscore nesting), which is how each Lambda receives its resource names.

tables:
  schemas: tads-schemas
  tracks: tads-tracks
  events: tads-events
  webhooks: tads-webhooks
  delete_requests: tads-delete-requests

# SQS queue the tracks/events handlers enqueue delete-request work onto.
# Set per-environment via TADS__DELETE_QUEUE_URL.
delete_queue_url: ""

# Maximum serialized Event size (bytes, 360 KiB). Larger Events are rejected with 413 —
# TADS holds small inline metadata; large data belongs in TAMS. Kept under DynamoDB's 400 KB
# item limit with headroom for the surrounding attributes.
max_payload_bytes: 368640

service:
  name: "TADS Reference (Rust)"
  type: "urn:x-tads:service:reference.rust"
  api_version: "0.1"
  service_version: "0.1.0"
