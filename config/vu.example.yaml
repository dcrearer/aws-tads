# Video-understanding (VU) pipeline configuration — TEMPLATE.
#
# Copy to `config/vu.yaml` (gitignored) and fill in. In Lambda the file is not bundled; values are
# injected by CDK via `VU__<SECTION>__<KEY>` env vars (prefix VU, separator `__`). Override the file
# path with the `VU_CONFIG` env var.

# SQS queue the webhook receiver enqueues analysis jobs to, and the worker consumes.
analysis_queue_url: ""

tams:
  # https:// base of the TAMS API (control plane: flows/segments).
  base_url: ""
  # Inbound-webhook HMAC: Secrets Manager ARN holding the signing key, and the header it arrives in.
  signature_secret_arn: ""
  signature_header: "x-tams-signature"
  # OAuth2 client-credentials for the TAMS control plane, supplied INLINE (no Secrets Manager).
  # Omit this block for unauthenticated TAMS. WARNING: client_secret here is plaintext — keep this
  # file out of version control (config/vu.yaml is gitignored).
  oauth:
    token_url: ""
    client_id: ""
    client_secret: ""
    scope: ""

tads:
  # https:// base of the TADS API this pipeline writes back to.
  base_url: ""
  # OAuth2 client-credentials, inline (same as tams.oauth; no Secrets Manager). client_secret is
  # plaintext — keep this file out of version control (config/vu.yaml is gitignored).
  oauth:
    token_url: ""
    client_id: ""
    client_secret: ""
    scope: ""

bedrock:
  # Cross-region inference profile id for TwelveLabs Pegasus 1.5 (base id is not on-demand capable).
  model_id: "us.twelvelabs.pegasus-1-5-v1:0"
  max_output_tokens: 4096

window:
  # Sliding look-back: analyse the new segment plus the previous (lookback_n - 1) for context.
  lookback_n: 3

key_moment:
  schema_external_id: "vu:key-moment:v1"
