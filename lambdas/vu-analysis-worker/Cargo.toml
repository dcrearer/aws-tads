[package]
name = "tads-lambda-vu-analysis-worker"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vu-analysis-worker"
path = "src/main.rs"

# Local-only tool: feed a segments_added JSON through the worker without writing to TADS.
[[bin]]
name = "vu-dry-run"
path = "src/bin/dry_run.rs"

[dependencies]
tads-domain.workspace = true
tads-telemetry.workspace = true
vu-domain.workspace = true
vu-time.workspace = true
vu-tams.workspace = true
vu-tads.workspace = true
vu-infer.workspace = true
vu-auth.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
chrono.workspace = true
config.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
lambda_runtime.workspace = true
reqwest.workspace = true
aws-config.workspace = true
aws-sdk-bedrockruntime.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
