[package]
name = "tads-lambda-webhook"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

# Three bins (src/bin/): relay (in-VPC, poke-triggered, drains the outbox and fans out onto the
# delivery queue), delivery (out-of-VPC, POSTs the callback — no DB), dlq (in-VPC, marks a webhook
# `error` after delivery retries are exhausted).

[dependencies]
tads-telemetry.workspace = true
tads-http.workspace = true
tads-domain.workspace = true
tads-store.workspace = true
lambda_runtime.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
reqwest.workspace = true
aws-sdk-sqs.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
